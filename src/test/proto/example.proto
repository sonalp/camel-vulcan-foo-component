// src/test/proto/test_messages.proto

syntax = "proto3";

package org.apache.camel.component.protojson.test;

option java_package = "org.apache.camel.component.protojson.test.proto";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/any.proto";
import "google/protobuf/wrappers.proto";


message BigDecimal {
  int64 unscaled_value = 1;
  int32 scale = 2;
}

message OrderMessage {
  string order_id = 1;
  BigDecimal amount = 2;
  BigDecimal tax_amount = 3;
}

// Basit mesaj
message SimpleUser {
    string name = 1;
    int32 age = 2;
    string email = 3;
    bool active = 4;
}

// Enum içeren mesaj
enum UserStatus {
    UNKNOWN = 0;
    ACTIVE = 1;
    INACTIVE = 2;
    SUSPENDED = 3;
}

message UserWithStatus {
    string name = 1;
    UserStatus status = 2;
}

// Nested mesaj
message Address {
    string street = 1;
    string city = 2;
    string country = 3;
    int32 zip_code = 4;
}

message UserWithAddress {
    string name = 1;
    Address address = 2;
}

// Repeated fields
message UserWithTags {
    string name = 1;
    repeated string tags = 2;
    repeated int32 scores = 3;
    repeated Address addresses = 4;
    repeated UserStatus statuses = 5;
}

// Map fields
message UserWithMetadata {
    string name = 1;
    map<string, string> string_meta = 2;
    map<string, int32> int_meta = 3;
    map<int32, string> int_key_meta = 4;
    map<string, Address> address_map = 5;
}

// Bytes field
message FileMessage {
    string filename = 1;
    bytes content = 2;
    repeated bytes chunks = 3;
}

// Well-known types
message EventMessage {
    string event_id = 1;
    google.protobuf.Timestamp created_at = 2;
    google.protobuf.Duration duration = 3;
    google.protobuf.Struct metadata = 4;
    google.protobuf.Any payload = 5;
    google.protobuf.StringValue optional_note = 6;
    google.protobuf.Int32Value optional_count = 7;
    google.protobuf.Int64Value optional_long = 8;
    google.protobuf.UInt32Value optional_uint = 9;
    google.protobuf.UInt64Value optional_ulong = 10;
    google.protobuf.FloatValue optional_float = 11;
    google.protobuf.DoubleValue optional_double = 12;
    google.protobuf.BoolValue optional_bool = 13;
    google.protobuf.BytesValue optional_bytes = 14;
}

// Karmaşık nested yapı
message ComplexMessage {
    string id = 1;
    SimpleUser user = 2;
    repeated EventMessage events = 3;
    map<string, UserWithAddress> user_map = 4;
    google.protobuf.Timestamp updated_at = 5;
}

// All scalar types for comprehensive testing
message AllScalarTypes {
    string string_field = 1;
    int32 int32_field = 2;
    int64 int64_field = 3;
    uint32 uint32_field = 4;
    uint64 uint64_field = 5;
    sint32 sint32_field = 6;
    sint64 sint64_field = 7;
    fixed32 fixed32_field = 8;
    fixed64 fixed64_field = 9;
    sfixed32 sfixed32_field = 10;
    sfixed64 sfixed64_field = 11;
    float float_field = 12;
    double double_field = 13;
    bool bool_field = 14;
    bytes bytes_field = 15;
}

// All map key types for comprehensive testing
message AllMapKeyTypes {
    string name = 1;
    map<string, string> string_key_map = 2;
    map<int32, string> int32_key_map = 3;
    map<int64, string> int64_key_map = 4;
    map<bool, string> bool_key_map = 5;
}